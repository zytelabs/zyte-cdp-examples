name: Live CDP smoke test

on:
  workflow_dispatch:

jobs:
  python-playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: languages/python-playwright/requirements.txt
      - run: python -m pip install -r requirements.txt
        working-directory: languages/python-playwright
      - run: python main.py
        working-directory: languages/python-playwright
        env:
          ZYTE_API_KEY: ${{ secrets.ZYTE_API_KEY }}
